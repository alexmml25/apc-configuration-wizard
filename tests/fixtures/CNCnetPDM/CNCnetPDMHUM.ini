; CNCnetPDM ini file

[GENERAL]
License = ENPQRSLNTZNOLLNVRUPTIRPQKLLXEFMLGTQJRQMSLFNLLNOS
ServiceID = 1
; Prefix for Group_ID (1-9) (if you run multiple instances of the service)
IncrementCounters = 0
; 0 = Unmodified value 1 = Compensate resets 2 = Difference between previous and actual counter
UseDNS = 0
; Identify devices by IP Address (0) or DNS Hostname (1))
AcquisitionMethod = 2
; Method that should be used for data acquisition 1=solicited (time based) 2=unsolicited (event driven) messaging
PollInterval = 5
; Solicited messaging: Interval (seconds) for reading data from devices
; Unsolicited messaging: Interval for checking if device is reachable
ReconnectAfter = 10
; Try to reconnect to device after polling it n times (n=PollInterval)
CollectStates = 1
; Acquire OEE machine state (numeric, 0=no 1=yes, prefix=E)
CollectCounters = 0
; Acquire part counter values (numeric, prefix=Z)
CollectOrders = 1
; Acquire data from device driver section 1 (prefix=O)
CollectQuality = 1
; Acquire data from device driver section 2 (prefix=A)
CollectFeeder = 1
; Acquire data from device driver section 3 (prefix=F)
CollectMessages = 0
; Acquire device name and data from device driver section 4 (prefix=M)

[RS232]
1 = 1001;19200;8;N;1;Humacao_L20X_1;10.101.99.47;683;0;localhost;1;0;none;none;0;citizenm.dll
2 = 1003;19200;8;N;1;Humacao_L20X_3;10.101.99.48;683;0;localhost;2;0;none;none;0;citizenm.dll
3 = 1008;19200;8;N;1;Humacao_L20X_8;10.101.99.63;683;0;localhost;3;0;none;none;0;citizenm.dll

; Line Id = Device Nr; Baud; Databits; Parity; StopBits; Machine Name; IP; Port; Method; DNS-Name; Mitsubishi Nr.; PLC Addr.(Counter); Share; Logfile Name; Logfile Version; DLL Name (16 items)
; Do not enter duplicates of Line Id and/or Device Nr


[Protokoll]
PFAD = C:\Medtronic\CNCNetPDM\log
LEVEL = 2
; (0-9) Level of logging, higher values output more details
MODUS = 12
; Generate one log file every day (12)

[OPC UA Server]
IP Address = 0
; Endpoints of OPC UA Server (0=DNS Hostname or specific IP)
Port = 48040
; Listen port of OPC UA Server (default=4840)
AnonymousAccess = 1
; Allow anonymous access to OPC UA Server (0=no 1=yes)
RestartAfter = 10
; Try to restart OPC UA Server after n seconds it goes down
StartOffline = 1
; Start CNCnetPDM without OPC UA Server (0=no 1=yes)
NumberOfUsers = 1
; Number of OPC UA usernames and passwords (default=1 max=10)

[OPC UA User 1]
Username = OpcUaClient
Password = OpcUaClient

[MTC Adapter]
IP Address = 0
; IP Address of MTC Adapter (0=all local IPs or specific IP)
Port = 7889
; Listen port of MTC Adapter (default=7878)
ReconnectAfter = 30
; Try to reconnect to MTC Adapter after n seconds if MTC Adapter goes down
StartOffline = 0
; Start CNCnetPDM without MTC Adapter (0=no 1=yes)
Heartbeat = 10000
; Heartbeat (milliseconds) to be sent from MTC Adapter to MTC Agents, default 10000
UTCTime = 0
; Output data in UTC (GMT) time = 1 or local time = 0
Availability tag code = avail
; Tag code for device availability (default=avail)

[Connect]
UDL_DATEI =C:\Medtronic\CNCNetPDM\connect.udl
; UDL file the service should use to build up the connection to the database
DB_TYPE = 1
; Database: Type of Database 1=MS SQL Server 2=ORACLE 3=MySQL MariaDB
ReconnectAfter = 30
; Database: Try to reconnect to database after n seconds if database goes down
StartOffline = 1
; Database: Start without connecting to database (0=no 1=yes)
WriteRawData = 1
; Database: Write to raw data table (store all records) (0=off 1=on)
WriteOnlineData = 0
; Database: Write to online data table (store actual records only) (0=off 1=on)
RawDataTable = MTH_RAW_DATA
; Database: Table name for raw data, default MTH_RAW_DATA
OnlineDataTable = MTH_ONLINE_DATA
; Database: Table name for online data, default MTH_ONLINE_DATA
ShiftDataTable = MTH_EQP_SHIFT_AVAIL_V
; Database: Table name for shift availability, default MTH_EQP_SHIFT_AVAIL_V
OrderDataTable = MTH_USER_CONTEXT
; Database: Table name for work order data, default MTH_USER_CONTEXT

[Offline]
FILENAME = C:\Medtronic\CNCNetPDM\offline\offline
SIZE = 0
; Do not create offline files = 0 or a new one if this size is reached (MB) (1-2000)
TIMEOUT = 100
; Interval (ms) between reading lines of offline files during processing
NR = 0
; Current offline file number

[ERP]
Changeddataonly = 0
; Database: Output only data that has changed since last reading cycle
CollectInShift = 0
; Acquire device data only if shift is active (Database: Requires shift table!)
Writeworkorder = 0
; Write current work order, operation and part number (Database: Read from table MTH_USER_CONTEXT)
Writedowntime = 1
; Write reason for downtime if any (0=no 1=yes)
Event = STATUS
; Tag name for OEE device status
Counter = COMP_QTY
; Tag name for part counter values
Quality = COMP_QLT
; Tag name for quality related messages from device
Message = COMP_MSG
; Tag name for device name and messages from device
Order = ORDER
; Tag name for current work order (output if Writeworkorder=1)
Operation = OPERATION
; Tag name for current operation/sequence (output if Writeworkorder=1)
Item = ITEM_A
; Tag name for current part (output if Writeworkorder=1)
Feeder = FEED_QTY
; Tag name for feeder messages
DownTimeReason = DOWN
; Tag name for OEE downtime reasons (output if Writedowntime=1)

[Hochwasser]
VERBUCHUNG = 80
; High water mark for number of messages waiting to be processed by output modules (50 - 200)
DEVICEINPUT = 10
; High water mark for number of messages waiting to be processed from device drivers (10 - 100)
