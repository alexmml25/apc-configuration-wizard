NCXK=NOCHANGE
;M6B=NOCHANGE 
M6B=NCALMSG.DLL
NX=NOCHANGE
M7NX=NOCHANGE
M8NX=NOCHANGE

[PLC Message]
NCXJ=NOCHANGE
NCXK=NOCHANGE
M6B=PLCMSG.DLL
NX=NOCHANGE
M7NX=NOCHANGE
M8NX=NOCHANGE

[BACK GROUND]
NCXJ=NOCHANGE
NCXK=NOCHANGE
M6B=NOCHANGE
NX=NOCHANGE
M7NX=NOCHANGE
M8NX=NOCHANGE

[System]
EnableRemoteMode=1
LogType=-1

