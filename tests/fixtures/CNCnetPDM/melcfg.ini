;Controller=M8NX
; Controller=NCXJ
; Controller=MCXK
; Controller=M6B
; Controller=M6B
Device=TCP1
CacheEnable=0


[CHGAPIVL]
NCXJ=NOCHANGE
NCXK=NOCHANGE
M6B=NOCHANGE
NX=CHGAPIVL.DLL
M7NX=CHGAPIVL.DLL
M8NX=CHGAPIVL.DLL

[NC Alarm Message]
